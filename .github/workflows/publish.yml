name: Pubblica

# Parte a ogni tag vX.Y.Z: pubblica su npm (se la versione non c'è già)
# e crea la Release su GitHub con le note del CHANGELOG.
# npm usa il Trusted Publishing (OIDC): nessun token da salvare nei secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Controlla che il tag corrisponda alla versione
        run: |
          VERSIONE=$(node -p "require('./package.json').version")
          if [ "v$VERSIONE" != "$GITHUB_REF_NAME" ]; then
            echo "Il tag $GITHUB_REF_NAME non corrisponde a package.json ($VERSIONE)"
            exit 1
          fi

      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test

      - name: Pubblica su npm
        run: |
          NOME=$(node -p "require('./package.json').name")
          VERSIONE=$(node -p "require('./package.json').version")
          if npm view "$NOME@$VERSIONE" version >/dev/null 2>&1; then
            echo "$NOME@$VERSIONE è già su npm, salto la pubblicazione"
          else
            npm publish --provenance --access public
          fi

      - name: Crea la Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONE=${GITHUB_REF_NAME#v}
          awk -v v="## $VERSIONE" '$0 ~ "^## " { if (stampa) exit; if (index($0, v) == 1) { stampa = 1; next } } stampa' CHANGELOG.md > note.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file note.md
